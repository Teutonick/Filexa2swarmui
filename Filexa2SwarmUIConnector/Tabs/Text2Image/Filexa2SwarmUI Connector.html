<div class="filexa-connector-panel">
  <h2>Filexa2SwarmUI Connector</h2>
  <p class="filexa-description">
    Connect this SwarmUI instance to
    <a href="https://t.me/WorkOnBigFilesBot" target="_blank" rel="noopener">Filexa</a>
    local generation. Keep SwarmUI open while jobs run.
  </p>

  <label for="filexa_api_url">Filexa API URL</label>
  <input id="filexa_api_url" placeholder="https://your-bot-domain.example" />

  <label for="filexa_token">Connection token</label>
  <input id="filexa_token" placeholder="Paste token from Telegram bot" />

  <label for="filexa_swarm_url">Local SwarmUI URL</label>
  <input id="filexa_swarm_url" value="http://127.0.0.1:7801" />

  <label class="filexa-row">
    <input id="filexa_enabled" type="checkbox" />
    Enable connector
  </label>

  <label class="filexa-row">
    <input id="filexa_debug_logging" type="checkbox" />
    Debug logging
  </label>

  <div class="filexa-actions">
    <button onclick="filexa2SwarmUIConnectorSave()">Save</button>
    <button onclick="filexa2SwarmUIConnectorDisconnect()">Disconnect</button>
    <button onclick="filexa2SwarmUIConnectorRefreshStatus()">Refresh status</button>
  </div>

  <pre id="filexa_status">Loading...</pre>
</div>
